<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Duo Headers – Profielen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="appbar">
    <img src="icons/icon-128.png" alt="">
    <div>
      <h1>Duo Headers</h1>
      <p>Profielen beheren</p>
    </div>
  </header>

  <main>
    <p class="muted intro">Domeinen: één per regel. Subdomeinen worden automatisch meegenomen
      (<code>example.com</code> matcht ook <code>api.example.com</code>).
      Zonder poort geldt een domein voor alle poorten; met poort (<code>localhost:4200</code>) alleen voor die poort.
      Bovenste profiel wint bij conflicterende headers.</p>

    <div class="toolbar">
      <button id="add" class="primary">+ Profiel toevoegen</button>
      <button id="import-add" title="Profiel(en) uit een bestand toevoegen aan de lijst">Profiel importeren</button>
      <span class="spacer"></span>
      <button id="collapse-all">Alles inklappen</button>
      <button id="expand-all">Alles uitklappen</button>
    </div>

    <p id="notice" class="notice" role="status" hidden></p>

    <div id="profiles"></div>

    <div class="toolbar">
      <button id="export-all" title="Alle profielen naar één bestand">Alles exporteren</button>
      <button id="import-replace" title="Alle huidige profielen vervangen door die uit een bestand">Alles importeren (vervangen)</button>
    </div>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
  </main>

  <template id="profile-tpl">
    <section class="profile">
      <header>
        <button class="toggle icon" title="In-/uitklappen">▾</button>
        <input type="checkbox" class="enabled" title="Actief">
        <input type="text" class="name" placeholder="Profielnaam">
        <button class="up icon" title="Omhoog">↑</button>
        <button class="down icon" title="Omlaag">↓</button>
        <button class="export" title="Dit profiel exporteren naar een bestand">Exporteren</button>
        <button class="delete danger">Verwijderen</button>
      </header>
      <div class="summary muted"></div>
      <div class="body">
      <label class="block">Domeinen</label>
      <textarea class="domains" placeholder="example.com&#10;localhost:4200"></textarea>
      <label class="block">Headers</label>
      <div class="headers"></div>
      <button class="add-header">+ Header</button>

      <label class="block ts-toggle"><input type="checkbox" class="ts-enabled"> Token service</label>
      <div class="ts-fields">
        <div class="ts-grid">
          <span>URL</span>
          <div class="ts-row">
            <select class="ts-method"><option>GET</option><option>POST</option></select>
            <input type="text" class="ts-url" placeholder="https://auth.example.com/token">
          </div>
          <span class="ts-body-label">Body</span>
          <textarea class="ts-body" placeholder='{"client_id": "..."} of grant_type=client_credentials&amp;...'></textarea>
          <span>Token-veld</span>
          <input type="text" class="ts-path" placeholder="access_token, header:Authorization, of leeg = hele response">
          <span>Header</span>
          <div class="ts-row">
            <input type="text" class="ts-header" placeholder="Authorization">
            <input type="text" class="ts-template" placeholder="Bearer {{token}}">
          </div>
        </div>
        <p class="muted ts-hint">De headers van dit profiel gaan mee naar de token service.
          <code>{{token}}</code> wordt vervangen door het opgehaalde token.</p>
        <div class="ts-status-row">
          <span class="ts-status muted"></span>
          <button class="ts-refresh">Nu ophalen</button>
        </div>
      </div>
      </div>
    </section>
  </template>

  <template id="header-tpl">
    <div class="header-row">
      <select class="h-op">
        <option value="set">set</option>
        <option value="remove">remove</option>
      </select>
      <input type="text" class="h-name" placeholder="Header-naam">
      <input type="text" class="h-value" placeholder="Waarde">
      <button class="h-delete icon" title="Header verwijderen">×</button>
    </div>
  </template>

  <script type="module" src="options.js"></script>
</body>
</html>
