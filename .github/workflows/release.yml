# Bouwt de extensie-zip bij een nieuwe GitHub-release en hangt die aan de release.
# Maak een release met een tag als v1.2.0; de versie in het manifest wordt daarop gezet.
# Zijn de secrets CWS_SERVICE_ACCOUNT_JSON, CWS_PUBLISHER_ID en CWS_EXTENSION_ID ingesteld,
# dan wordt de zip ook naar de Chrome Web Store geüpload en ingediend voor review.
# Zonder die secrets upload je de zip handmatig in de developer console.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Versie uit tag halen
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "Tag '$tag' is geen geldige versie (verwacht bv. v1.2.0)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Zip maken
        run: scripts/package.sh "${{ steps.version.outputs.version }}"

      - name: Zip aan release hangen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "dist/duo-headers-${{ steps.version.outputs.version }}.zip" --clobber

      - name: Publiceren in de Chrome Web Store
        if: env.CWS_SERVICE_ACCOUNT_JSON != '' && env.CWS_PUBLISHER_ID != '' && env.CWS_EXTENSION_ID != ''
        run: scripts/cws-publish.sh "dist/duo-headers-${{ steps.version.outputs.version }}.zip"
